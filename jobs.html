<!DOCTYPE html>
<html>
<head><title>Jobs</title></head>
<body>
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "JobPosting",
  "title": "Software Engineer",
  "description": "We are hiring.",
  "datePosted": "2024-01-01",
  "validThrough": "2030-01-01",
  "hiringOrganization": {
    "@type": "Organization",
    "name": "MyCompany"
  },
  "jobLocation": {
    "@type": "Place",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "US"
    }
  }
}
</script>
</body>
</html>
